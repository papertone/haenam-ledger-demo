<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>해남농원 주문장부</title>
<meta name="description" content="절임배추 농원용 주문장부와 단골 관리 시연 화면. 모든 데이터는 예시입니다.">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="해남농원 주문장부 (시연)">
<meta property="og:description" content="엑셀 주문 장부를 손님 명단으로. 주문 적기, 단골 찾기, 안내 문자까지 한 화면에서.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 한 권의 주문 장부. 넓은 화면은 왼쪽 세로 메뉴, 휴대폰은 아래 탭. 모든 조작은 56px 이상, 글자는 18px부터. */
:root{
  --bg:#F1F4EC; --surface:#FFFFFF; --surface-2:#E5EBDF; --ink:#15201A; --ink-2:#4A5A4F; --line:#C7D1C1;
  --accent:#2B6A33; --accent-ink:#FFFFFF; --accent-soft:#DAEBD5;
  --mark:#F7D84A; --mark-ink:#2A2300; --mark-soft:#FDF3C4;
  --bar-off:#B6C4B0; --focus:#0E3F17; --scrim:rgba(12,20,14,.48);
  --ok:#1E7A47; --warn:#8A5A00; --warn-soft:#FAEDCC; --bad:#A8342A; --bad-soft:#F6DDD8;
  --f-display:'Black Han Sans','IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111712; --surface:#192019; --surface-2:#222B23; --ink:#E9F0E6; --ink-2:#A7B7AA; --line:#344236;
  --accent:#7DC482; --accent-ink:#0C1A0E; --accent-soft:#1F3A24;
  --mark:#E9C83B; --mark-ink:#1C1600; --mark-soft:#3A3315;
  --bar-off:#3D4C40; --focus:#E9C83B; --scrim:rgba(0,0,0,.6);
  --ok:#6FCF97; --warn:#E6B44F; --warn-soft:#3A2F14; --bad:#F08476; --bad-soft:#3F2220;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111712; --surface:#192019; --surface-2:#222B23; --ink:#E9F0E6; --ink-2:#A7B7AA; --line:#344236;
  --accent:#7DC482; --accent-ink:#0C1A0E; --accent-soft:#1F3A24;
  --mark:#E9C83B; --mark-ink:#1C1600; --mark-soft:#3A3315;
  --bar-off:#3D4C40; --focus:#E9C83B; --scrim:rgba(0,0,0,.6);
  --ok:#6FCF97; --warn:#E6B44F; --warn-soft:#3A2F14; --bad:#F08476; --bad-soft:#3F2220;
  color-scheme:dark }

*{box-sizing:border-box}
body{margin:0;word-break:keep-all;overflow-wrap:anywhere;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:15px}

/* ---------- 메뉴 ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:6px 2px;border-radius:12px;
  text-decoration:none;color:var(--ink-2);font-size:13.5px;font-weight:600;white-space:nowrap}
.nav a svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.nav .brand{display:none}
@media (min-width:960px){
  .nav{top:0;right:auto;width:236px;border-top:0;border-right:1px solid var(--line);grid-template-columns:1fr;grid-auto-rows:min-content;gap:6px;padding:28px 16px}
  .nav a{flex-direction:row;justify-content:flex-start;gap:14px;font-size:19px;padding:12px 16px;min-height:60px}
  .nav .brand{display:block;padding:0 8px 22px}
  .shell{margin-left:236px}
}
.brand-name{font-family:var(--f-display);font-size:30px;line-height:1.1;letter-spacing:.01em}
.brand-sub{font-size:15px;color:var(--ink-2);font-weight:600}

/* ---------- 바탕 ---------- */
.wrap{max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:14px calc(110px + env(safe-area-inset-bottom,0px))}
body.has-savebar .wrap{padding-bottom:calc(200px + env(safe-area-inset-bottom,0px))}
@media (min-width:960px){.wrap{padding-inline:36px;padding-block:28px 56px} body.has-savebar .wrap{padding-bottom:56px}}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.topbar .mob-brand{display:flex;align-items:baseline;gap:10px}
@media (min-width:960px){.topbar .mob-brand{visibility:hidden}}
.demo-tag{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:var(--mark-soft);color:var(--ink);font-size:14.5px;font-weight:600;border:1px solid var(--mark)}
.view{display:grid;gap:22px}
.view-head{display:grid;gap:6px}
.view-head h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,42px);letter-spacing:.005em}
.view-head p{color:var(--ink-2);max-width:62ch}
.date-line{font-weight:600;color:var(--ink-2)}

/* ---------- 버튼, 칩, 표시 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 22px;border-radius:14px;border:2px solid var(--line);
  background:var(--surface);color:var(--ink);font-weight:700;font-size:18px;cursor:pointer;text-decoration:none;text-align:center;line-height:1.25}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{min-height:68px;font-size:21px;padding:0 30px;border-radius:16px}
.btn.wide{width:100%}
.btn:disabled{opacity:.42;cursor:not-allowed;filter:none}
.btn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.link-btn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:50px;padding:0 18px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:17px;cursor:pointer}
.chip .cnt{font-weight:500;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .cnt{color:var(--bg);opacity:.8}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;font-size:15px;font-weight:700;white-space:nowrap;line-height:1.5}
.p-new{background:var(--warn-soft);color:var(--warn)}
.p-paid{background:var(--accent-soft);color:var(--accent)}
.p-done{background:var(--surface-2);color:var(--ink-2)}
.c-yes{background:var(--accent-soft);color:var(--accent)}
.c-unk{background:var(--surface-2);color:var(--ink-2)}
.c-no{background:var(--bad-soft);color:var(--bad)}
.hl{background:linear-gradient(transparent 52%, var(--mark) 52%, var(--mark) 92%, transparent 92%);padding:0 2px;color:var(--ink)}

/* 시즌 칸: 이 서비스의 표식. 해마다 산 해는 칠해진 칸 */
.strip{display:inline-flex;gap:4px;vertical-align:middle}
.strip span{width:36px;height:30px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.strip span.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.strip span.open{border-style:dashed}
.strip.lg span{width:58px;height:44px;font-size:16px;border-radius:10px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.panel h2{font-size:22px}
.panel-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}

/* ---------- 오늘 ---------- */
.hello{display:grid;gap:18px;grid-template-columns:1fr;align-items:end}
@media (min-width:760px){.hello{grid-template-columns:1fr auto}}
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.tile{display:grid;gap:4px;text-align:left;padding:20px;border-radius:18px;border:2px solid var(--line);background:var(--surface);cursor:pointer}
.tile:hover{border-color:var(--ink-2)}
.tile .lbl{font-weight:700;font-size:17px;color:var(--ink-2)}
.tile .big{font-family:var(--f-display);font-size:46px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .big small{font-size:24px;margin-left:2px}
.tile .sub{color:var(--ink-2);font-size:16px}
.tile.attn{border-color:var(--mark);background:var(--mark-soft)}
.home-grid{display:grid;gap:22px;grid-template-columns:1fr}
@media (min-width:1080px){.home-grid{grid-template-columns:1.35fr 1fr}}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chart svg{display:block;width:100%;min-width:600px;height:auto}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .tick{fill:var(--ink-2);font-size:13px;font-family:var(--f-body)}
.chart .bar{fill:var(--bar-off)}
.chart .bar.on{fill:var(--accent)}
.chart .bar.cur{fill:var(--mark);stroke:var(--ink);stroke-width:1.5}
.chart .xl{fill:var(--ink-2);font-size:13px;text-anchor:middle;font-family:var(--f-body)}
.chart .xl.yr{fill:var(--ink);font-weight:700;font-size:14px}
.chart .val{fill:var(--ink);font-size:14px;font-weight:700;text-anchor:middle;font-family:var(--f-body)}
.chart .sep{stroke:var(--line);stroke-dasharray:3 4}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:15px;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.people{display:grid;gap:0;list-style:none;margin:0;padding:0}
.people li{border-top:1px solid var(--line)}
.people li:first-child{border-top:0}
.person-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;width:100%;padding:14px 4px;background:none;border:0;text-align:left;cursor:pointer;border-radius:10px}
.person-row:hover{background:var(--surface-2)}
.person-row .nm{font-weight:700;font-size:19px}
.person-row .meta{color:var(--ink-2);font-size:15.5px;font-variant-numeric:tabular-nums}
.season-tbl{width:100%;border-collapse:collapse;font-size:17px}
.season-tbl th,.season-tbl td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.season-tbl th:first-child,.season-tbl td:first-child{text-align:left}
.season-tbl thead th{font-size:15px;color:var(--ink-2);border-bottom:2px solid var(--ink)}
.season-tbl tbody tr:last-child td{border-bottom:0}

/* ---------- 주문 적기 ---------- */
.order-grid{display:grid;gap:22px;grid-template-columns:1fr;align-items:start}
@media (min-width:1080px){.order-grid{grid-template-columns:minmax(0,1fr) 340px}}
.form{display:grid;gap:18px;min-width:0}
fieldset{border:1px solid var(--line);border-radius:18px;padding:18px 18px 20px;margin:0;background:var(--surface);display:grid;gap:16px;min-width:0}
legend{font-weight:700;font-size:21px;padding:0 8px;margin-left:-8px}
.field{display:grid;gap:8px}
.field > label,.lab{font-weight:700;font-size:18px}
.inp{width:100%;min-height:60px;padding:12px 16px;border:2px solid var(--line);border-radius:14px;background:var(--surface);font-size:21px}
textarea.inp{min-height:110px;line-height:1.5;resize:vertical;font-size:19px}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px var(--accent-soft)}
.inp::placeholder{color:var(--ink-2);opacity:.7}
.two{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:640px){.two{grid-template-columns:1fr 1fr}}
.suggest{display:grid;gap:8px}
.suggest button{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;text-align:left;padding:12px 16px;border:2px solid var(--line);border-radius:14px;background:var(--surface-2);cursor:pointer}
.suggest button:hover{border-color:var(--accent)}
.suggest .nm{font-weight:700;font-size:19px}
.linked{display:grid;gap:12px;padding:16px;border-radius:14px;background:var(--accent-soft);border:2px solid var(--accent)}
.linked .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.linked b{font-size:19px}
.prods{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:760px){.prods{grid-template-columns:1fr 1fr}}
.prod{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:14px 14px 14px 18px;border:2px solid var(--line);border-radius:16px;background:var(--surface)}
.prod.on{border-color:var(--accent);background:var(--accent-soft)}
.prod .pn{font-weight:700;font-size:19px;line-height:1.3}
.prod .pp{color:var(--ink-2);font-size:15.5px;font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;gap:6px}
.step button{width:54px;height:54px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:28px;font-weight:700;line-height:1;cursor:pointer;display:grid;place-items:center}
.step button:hover{border-color:var(--ink-2)}
.step output{min-width:44px;text-align:center;font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums}
.seg{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.seg label{position:relative;display:flex;align-items:center;justify-content:center;min-height:60px;padding:8px 14px;border:2px solid var(--line);border-radius:14px;
  font-weight:700;cursor:pointer;text-align:center;background:var(--surface);line-height:1.3}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg label:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.check{display:flex;gap:14px;align-items:center;min-height:60px;padding:8px 16px;border:2px solid var(--line);border-radius:14px;cursor:pointer;font-weight:700;background:var(--surface)}
.check input{width:28px;height:28px;accent-color:var(--accent);flex:none}
.script{padding:14px 16px;border-radius:14px;background:var(--surface-2);font-size:19px}
.script q{font-weight:700}
.paste summary{cursor:pointer;font-weight:700;font-size:19px;list-style:none;display:flex;align-items:center;gap:10px;min-height:44px}
.paste summary::-webkit-details-marker{display:none}
.paste summary::before{content:"+";display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--surface-2);font-size:22px}
.paste[open] summary::before{content:"−"}
.paste .row{display:flex;gap:10px;flex-wrap:wrap}
.note{padding:12px 16px;border-radius:12px;background:var(--surface-2);font-size:16.5px}
.note.ok{background:var(--accent-soft)}
.note.warn{background:var(--warn-soft)}
.note.bad{background:var(--bad-soft)}
.summary{position:sticky;top:24px;display:grid;gap:14px}
.summary h2{font-size:22px}
.sum-lines{display:grid;gap:6px;font-size:17px}
.sum-lines div{display:flex;justify-content:space-between;gap:12px}
.sum-total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);padding-top:12px}
.sum-total b{font-family:var(--f-display);font-weight:400;font-size:34px;font-variant-numeric:tabular-nums}
.errs{margin:0;padding-left:20px;color:var(--bad);font-size:16px}
.savebar{display:none}
@media (max-width:1079px){
  .order-grid .summary-aside{display:none}
  body.has-savebar .savebar{display:flex;position:fixed;left:0;right:0;bottom:calc(71px + env(safe-area-inset-bottom,0px));z-index:29;background:var(--surface);
    border-top:1px solid var(--line);padding:10px 16px;gap:12px;align-items:center;justify-content:space-between}
}
@media (min-width:960px) and (max-width:1079px){body.has-savebar .savebar{left:236px;bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}}
.savebar .tot{display:grid;line-height:1.2}
.savebar .tot b{font-family:var(--f-display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,25%{background:var(--mark-soft);border-color:var(--mark)}}

/* ---------- 장부 ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1 1 320px;min-width:0}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:24px;height:24px;fill:none;stroke:var(--ink-2);stroke-width:2.2}
.search .inp{padding-left:52px}
.result-line{font-size:17px;color:var(--ink-2)}
.result-line b{color:var(--ink);font-variant-numeric:tabular-nums}
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.tbl{width:100%;border-collapse:collapse;font-size:17px}
.tbl th{text-align:left;font-size:15px;color:var(--ink-2);font-weight:700;padding:14px 12px;border-bottom:2px solid var(--ink);white-space:nowrap;background:var(--surface)}
.tbl td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tbody tr.is-new{background:var(--mark-soft)}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .d{white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl .who b{display:block;font-size:18px}
.tbl .gift{display:block;font-size:14.5px;color:var(--ink-2)}
.desk-only{display:none}
@media (min-width:820px){.desk-only{display:block}.mob-only{display:none}}
.lcards{list-style:none;margin:0;padding:0}
.lcards li{border-bottom:1px solid var(--line)}
.lcards li:last-child{border-bottom:0}
.lcard{display:grid;gap:6px;width:100%;padding:16px 18px;text-align:left;background:none;border:0;cursor:pointer}
.lcard.is-new{background:var(--mark-soft)}
.lcard .r1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.lcard .r1 b{font-size:19px}
.lcard .r2{color:var(--ink-2);font-size:16px;font-variant-numeric:tabular-nums}
.lcard .r3{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.more{display:flex;justify-content:center;padding:16px}

/* ---------- 손님 ---------- */
.segs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.segbtn{display:grid;gap:2px;text-align:left;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);cursor:pointer}
.segbtn .n{font-family:var(--f-display);font-size:32px;line-height:1.15;font-variant-numeric:tabular-nums}
.segbtn .n small{font-size:18px}
.segbtn .t{font-weight:700;font-size:17px}
.segbtn .dsc{font-size:14.5px;color:var(--ink-2);line-height:1.4}
.segbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.clist{display:grid;gap:0;list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.clist li{border-bottom:1px solid var(--line)}
.clist li:last-child{border-bottom:0}

<script>
(function(){

/* ================= 기본 도구 ================= */
const $ = (s, el) => (el || document).querySelector(s);

const mdw = s => { const d = parseISO(s); return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`; };
const won = n => n.toLocaleString('ko-KR') + '원';
const seasonOf = s => { const y = +s.slice(0,4), m = +s.slice(5,7); if (m >= 9) return y; if (m <= 1) return y - 1; return null; };
const yLabel = y => y === 2026 ? '올해' : y === 2025 ? '작년' : '재작년';
const digits = s => String(s || '').replace(/\D/g, '');
function fmtPhone(v){ const d = digits(v).slice(0, 11); if (d.length <= 3) return d; if (d.length <= 7) return d.slice(0,3) + '-' + d.slice(3); return d.slice(0,3) + '-' + d.slice(3,7) + '-' + d.slice(7); }

function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ================= 상품 (가격은 예시) ================= */
const PRODUCTS = [
  { id:'b20', name:'절임배추 20kg', price:45000, kind:'배추' },

/* ================= 예시 장부 만들기 (2년치) ================= */
const SUR = [['김',21],['이',15],['박',8],['최',5],['정',4.4],['강',2.4],['조',2.2],['윤',2.1],['장',2],['임',1.8],['한',1.5],['오',1.4],['서',1.3],['신',1.2],['권',1.1],['황',1.1],['안',1],['송',1],['류',.8],['홍',.8],['문',.8],['양',.7],['배',.7],['고',.7],['나',.6],['노',.6]];

const MEMOS = ['경비실에 맡겨 달라고 하심','배추 조금 덜 짜게 원하심','언니네 것도 같이 주문하심','오전 배송 원하심','작년에 배송이 늦어 미안했던 분','현관 앞에 두면 된다고 하심'];

const customers = [], orders = [];
const usedPhones = new Set();
let nextCid = 1, nextOid = 1;
const genName = () => wpick(SUR) + pick(GIVEN);
function genPhone(){ let p; do { p = `010-${int(1000,9999)}-${int(1000,9999)}`; } while (usedPhones.has(p)); usedPhones.add(p); return p; }
function genAddr(){ let a = `${wpick(ADDR)} ${pick(STREET)} ${int(12,1480)}`; if (R() < .55) a += `, ${100 + int(1,15)}동 ${int(1,20)}0${int(1,4)}호`; return a; }
function newCustomer(){
  const c = { id: nextCid++, name: genName(), phone: genPhone(), addr: genAddr(), consent: { status:'미확인', date:null, method:null },
    memo: R() < .08 ? pick(MEMOS) : '', pref: wpick([['b20',74],['b10',26]]), base: wpick([[1,20],[2,34],[3,24],[4,11],[5,6],[6,3],[8,1.2],[10,.8]]) };

function seasonDate(year){
  const a = new Date(year, 8, 1).getTime();
  let b, c;

function shipFor(dIso, year){
  const d = parseISO(dIso);

}

}
(function generate(){

  for (let i = 0; i < 190; i++){ const c = newCustomer(); s24.push(c); placeSeason(c, 2024); if (R() < .04) placeSeason(c, 2024); }
  s24.forEach(c => { if (R() < .62){ placeSeason(c, 2025); s25.add(c); if (R() < .04) placeSeason(c, 2025); } });
  for (let i = 0; i < 92; i++){ const c = newCustomer(); placeSeason(c, 2025); s25.add(c); }
  s25.forEach(c => { if (R() < .17) placeSeason(c, 2026); });
  s24.forEach(c => { if (!s25.has(c) && R() < .06) placeSeason(c, 2026); });
  for (let i = 0; i < 12; i++){ const c = newCustomer(); placeSeason(c, 2026); }
  [2025, 2026].forEach(y => {
    for (let i = 0; i < 20; i++){
      const c = R() < .7 ? pick(customers) : newCustomer();
      const a = new Date(y, 1, 1).getTime(), b = new Date(y, 7, 31).getTime();
      const date = iso(new Date(a + R() * (b - a)));
      const items = [{ pid: R() < .6 ? 'k5' : 'k10', qty: R() < .8 ? 1 : 2 }];
      if (R() < .2) items.push({ pid:'y3', qty:1 });
      orders.push({ id:0, cid:c.id, date, items, recipient:null, ship: iso(new Date(parseISO(date).getTime() + int(2,5) * 864e5)), status:'배송 완료', memo:'' });
    }
  });
  orders.sort((a, b) => a.date.localeCompare(b.date));
  orders.forEach(o => o.id = nextOid++);
  orders.reverse();
  // 문자 수신 동의: 대부분은 기록이 없음
  const byC = new Map();
  orders.forEach(o => { if (!byC.has(o.cid)) byC.set(o.cid, []); byC.get(o.cid).push(o); });
  customers.forEach(c => {
    const os = (byC.get(c.id) || []).slice().sort((a, b) => a.date.localeCompare(b.date));
    const o26 = os.find(o => seasonOf(o.date) === 2026), o25 = os.find(o => seasonOf(o.date) === 2025), o24 = os.find(o => seasonOf(o.date) === 2024);
    const r = R();
    if (o26){ if (r < .55) c.consent = { status:'동의', date:o26.date, method:'전화 주문 때' }; else if (r < .6) c.consent = { status:'거부', date:o26.date, method:'전화 주문 때' }; }
    else if (o25){ if (r < .3) c.consent = { status:'동의', date:o25.date, method: R() < .7 ? '전화 주문 때' : '카톡 채널 추가' }; else if (r < .33) c.consent = { status:'거부', date:o25.date, method:'전화 주문 때' }; }
    else if (o24 && r < .08) c.consent = { status:'동의', date:o24.date, method:'카톡 채널 추가' };
  });
})();

let SC = null;
function stats(){
  if (SC) return SC;
  const m = new Map();
  customers.forEach(c => m.set(c.id, { orders:[], seasons:new Set(), boxes:{}, kinds:new Set(), pids:new Set(), amount:0, last:null, first:null, gift:false, maxBox:0, active:false }));
  orders.forEach(o => {
    const s = m.get(o.cid); s.orders.push(o);
    const se = seasonOf(o.date), bx = boxes(o);
    if (se != null){ s.seasons.add(se); s.boxes[se] = (s.boxes[se] || 0) + bx; }
    o.items.forEach(i => { s.kinds.add(P[i.pid].kind); s.pids.add(i.pid); });
    s.amount += amt(o);
    if (!s.last || o.date > s.last) s.last = o.date;
    if (!s.first || o.date < s.first) s.first = o.date;
    if (o.recipient) s.gift = true;
    if (se === 2026 && o.status !== '배송 완료') s.active = true;
  });
  m.forEach(s => { s.maxBox = Math.max(0, ...Object.values(s.boxes)); });
  SC = m; return m;
}

function seasonSum(y){
  const os = orders.filter(o => seasonOf(o.date) === y);
  const cs = new Set(os.map(o => o.cid));
  return { n: os.length, cust: cs.size, box: os.reduce((a, o) => a + boxes(o), 0), amt: os.reduce((a, o) => a + amt(o), 0), cs };
}
const isNarrow = () => document.documentElement.clientWidth < 640;
let wasNarrow = isNarrow();

function niceStep(max){ const raw = max / 4; const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function monthChart(){
  const months = [];
  for (let y = 2024; y <= 2026; y++) for (let m = 1; m <= 12; m++){ if (y === 2026 && m > 10) break; months.push({ y, m, n:0 }); }
  orders.forEach(o => { const i = (+o.date.slice(0,4) - 2024) * 12 + (+o.date.slice(5,7) - 1); if (months[i]) months[i].n++; });
  const narrow = isNarrow();
  const W = narrow ? 380 : 720, H = narrow ? 260 : 290, L = narrow ? 36 : 46, RR = narrow ? 10 : 14, T = 30, B = 44, pw = W - L - RR, ph = H - T - B;
  const max = Math.max(...months.map(x => x.n)), step = niceStep(max), top = Math.ceil(max / step) * step, bw = pw / months.length;
  const Y = v => T + ph - (v / top) * ph;
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line class="grid" x1="${L}" x2="${W - RR}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tick" x="${L - 8}" y="${Y(v) + 5}" text-anchor="end">${v}</text>`;
  const maxI = months.findIndex(x => x.n === max);
  months.forEach((x, i) => {
    const cx = L + i * bw + bw / 2, w = bw * .68, h = Math.max(0, (x.n / top) * ph), cur = x.y === 2026 && x.m === 10;
    const cls = cur ? 'bar cur' : (x.m >= 9 && x.m <= 12 ? 'bar on' : 'bar');
    if (x.m === 1 && i > 0) g += `<line class="sep" x1="${L + i * bw}" x2="${L + i * bw}" y1="${T}" y2="${T + ph}"/>`;
    g += `<rect class="${cls}" x="${cx - w / 2}" y="${Y(x.n) }" width="${w}" height="${h}" rx="3"><title>${x.y}년 ${x.m}월 주문 ${x.n}건</title></rect>`;
    if (x.m === 1) g += `<text class="xl yr" x="${cx}" y="${H - B + 22}">${x.y}년</text>`;
    else if (narrow ? (x.m === 10 && x.y === 2026) : (x.m === 4 || x.m === 7 || x.m === 10)) g += `<text class="xl" x="${cx}" y="${H - B + 22}">${x.m}월</text>`;
    if (i === maxI || cur) g += `<text class="val" x="${cx}" y="${Y(x.n) - 8}">${x.n}건</text>`;
  });
  return `<svg class="${narrow ? 'narrow' : ''}" viewBox="0 0 ${W} ${H}" role="img" aria-label="2024년 1월부터 2026년 10월까지 월별 주문 건수. 해마다 10월과 11월에 가장 많습니다.">${g}</svg>`;
}

function parsePaste(text){
  const done = [];
  const ph = text.match(/01[016789][-\s.]?\d{3,4}[-\s.]?\d{4}/);
  const lines = text.split(/\n/).map(s => s.trim()).filter(Boolean);
  let pid = null;
  if (/김치/.test(text)) pid = /10\s*(kg|키로|킬로)/i.test(text) ? 'k10' : 'k5';
  else if (/양념/.test(text) && !/배추/.test(text)) pid = 'y3';
  else if (/10\s*(kg|키로|킬로)/i.test(text)) pid = 'b10';
  else if (/배추|20\s*(kg|키로|킬로)/i.test(text)) pid = 'b20';
  const q = text.match(/(\d+)\s*(박스|상자|box)/i);
  const sd = text.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
  const addr = lines.find(l => !/01[016789]/.test(l) && /\d/.test(l) && /(시|군|구)\s/.test(l) && /(로|길|동|읍|면)/.test(l));
  let nm = (text.match(/(?:이름|성함)\s*[:：]?\s*([가-힣]{2,4})/) || [])[1];
  if (!nm && ph){ const line = lines.find(l => l.includes(ph[0])); const rest = line ? line.replace(ph[0], '').trim() : ''; const m = rest.match(/([가-힣]{2,4})$/) || rest.match(/^([가-힣]{2,4})/); if (m) nm = m[1]; }
  if (ph){
    const f = fmtPhone(ph[0]); const ex = customers.find(c => c.phone === f);
    if (ex){ linkCustomer(ex); done.push(`단골 ${ex.name}님`); } else { D.cid = null; D.phone = f; $('#f-phone').value = f; done.push('전화번호'); }
    flashEl($('#f-phone'));
  }
  if (nm && !D.cid){ D.name = nm; $('#f-name').value = nm; flashEl($('#f-name')); done.push('이름'); }
  if (addr){ D.addr = addr; $('#f-addr').value = addr; flashEl($('#f-addr')); done.push('주소'); }
  if (pid){ Object.keys(D.items).forEach(k => D.items[k] = 0); D.items[pid] = q ? Math.min(99, +q[1]) : 1; flashEl($('#prod-' + pid)); done.push(`${P[pid].name} ${D.items[pid]}박스`); }
  if (sd){ const s = iso(new Date(2026, +sd[1] - 1, +sd[2])); D.ship = s; $('#f-ship').value = s; flashEl($('#f-ship')); done.push(`보낼 날 ${md(s)}`); }
  return done;
}

const REGIONS = ['서울','경기','인천','부산','대구','광주','대전','울산','세종','전남','전북','경남','경북','충남','충북','강원','제주','해남','목포','순천','여수'];
const COND = {
  season: y => ({ key:'s' + y, label:`${yLabel(y)}(${y}) 김장 때 사신 분`, f:s => s.seasons.has(y) }),
  notSeason: y => ({ key:'n' + y, label:`${yLabel(y)}은 아직 주문 없음`, f:s => !s.seasons.has(y) }),

const PRESETS = [
  { id:'p1', label:'작년에 사셨는데 올해 아직 안 오신 분', conds:() => [COND.season(2025), COND.notSeason(2026)], type:'ad' },
  { id:'p2', label:'두 해 연속 사신 단골', conds:() => [COND.loyal()], type:'ad' },

];
function parseNL(text){
  const t = text.replace(/\s+/g, ' ').trim(); const conds = []; let ref = null;
  const has24 = /재작년|2024/.test(t); const t2 = t.replace(/재작년|2024/g, '');
  const has25 = /작년|지난해|2025/.test(t2);
  const not26 = /올해.{0,10}(아직|안 |안오|안사|않|없|못)/.test(t);
  const yes26 = !not26 && /올해/.test(t) && /(주문|사신|산 |오신|하신)/.test(t);
  if (/연속|단골|두\s*해|2년|매년/.test(t)) conds.push(COND.loyal());
  else { if (has24){ conds.push(COND.season(2024)); ref = 2024; } if (has25){ conds.push(COND.season(2025)); ref = 2025; } }
  if (not26) conds.push(COND.notSeason(2026));
  if (yes26){ conds.push(COND.season(2026)); ref = ref || 2026; }
  const bx = t.match(/(\d+)\s*(박스|상자)/); if (bx) conds.push(COND.minBox(ref, +bx[1]));
  if (/김치/.test(t)) conds.push(COND.kind('김치'));
  if (/양념/.test(t)) conds.push(COND.kind('양념'));
  if (/10\s*(kg|키로|킬로)/i.test(t) && !/김치/.test(t)) conds.push(COND.pid('b10'));
  if (/20\s*(kg|키로|킬로)/i.test(t)) conds.push(COND.pid('b20'));
  const regs = REGIONS.filter(r => t.includes(r)); if (regs.length) conds.push(COND.region(regs));
  if (/한\s*번만|딱\s*한\s*번/.test(t)) conds.push(COND.once());
  if (/선물/.test(t)) conds.push(COND.gift());
  const seen = new Set(); return conds.filter(c => seen.has(c.key) ? false : seen.add(c.key));
}

          <h2>무슨 내용을 보낼까요?</h2>
          <div class="seg" role="radiogroup" aria-label="안내 종류">
            <label><input type="radio" name="mtype" value="ad" ${C.type === 'ad' ? 'checked' : ''}><span>판매 안내 (광고)</span></label>
            <label><input type="radio" name="mtype" value="info" ${C.type === 'info' ? 'checked' : ''}><span>주문, 배송 안내</span></label>
          </div>
          <p class="muted small" id="s-typehelp"></p>
          <div class="field"><label for="s-text">문자 내용</label><textarea class="inp" id="s-text" style="min-height:220px">${esc(C.text)}</textarea></div>
          <div class="bytes" id="s-bytes"></div>
          <div class="lab">언제 보낼까요?</div>
          <div class="chips"><button class="chip" data-mode="now" aria-pressed="${C.mode === 'now'}">지금 보내기</button><button class="chip" data-mode="later" aria-pressed="${C.mode === 'later'}">내일 오전 10시에 보내기</button></div>
          <p id="s-night" class="note warn small" hidden></p>
          <div id="s-go"></div>
        </div>
      </div>
      <div style="display:grid;gap:22px;align-content:start;min-width:0">
        <div class="panel" style="display:grid;gap:12px;justify-items:center"><h2 style="justify-self:start">받는 분 휴대폰에는</h2><div class="phone"><div class="from">해남농원</div><div class="bubble" id="s-preview"></div></div><p class="muted small" style="justify-self:start">노란 부분은 법에 따라 자동으로 붙어요.</p></div>
        <div class="panel" style="display:grid;gap:10px"><h2>보낸 안내</h2><ul class="hist" id="s-hist"></ul></div>
      </div>
    </div>`;
  sendDyn();
};
function sendDyn(){
  if (!$('#s-aud')) return;
  document.querySelectorAll('#v-send .preset').forEach(b => b.setAttribute('aria-pressed', b.dataset.preset === C.preset ? 'true' : 'false'));
  $('#s-conds').innerHTML = C.conds.length ? `<span class="lab small" style="align-self:center">이렇게 알아들었어요:</span>` + C.conds.map(k => `<span class="cond">${esc(k.label)}<button data-rm="${esc(k.key)}" aria-label="${esc(k.label)} 조건 빼기">×</button></span>`).join('') : '';
  const A = audience();
  if (!A) $('#s-aud').innerHTML = `<h2>보낼 분</h2><p class="muted">위에서 손님 묶음을 고르면 몇 분께 가는지 바로 보여요.</p>`;
  else {
    const extra = C.type === 'ad'
      ? `<div><span class="k">동의 기록 없음</span><span class="v">${A.unk}<small>분</small></span></div><div><span class="k">받기 싫다고 하심</span><span class="v">${A.no}<small>분</small></span></div>`
      : `<div><span class="k">올해 주문이 없는 분</span><span class="v">${A.noOrder}<small>분</small></span></div>`;
    $('#s-aud').innerHTML = `<h2>보낼 분</h2>
      <div class="aud-nums"><div><span class="k">조건에 맞는 손님</span><span class="v">${A.matched.length}<small>분</small></span></div>${extra}<div class="go"><span class="k">실제로 보낼 분</span><span class="v">${A.send.length}<small>분</small></span></div></div>
      ${C.type === 'ad' && A.matched.length > A.send.length ? `<p class="note small">판매 안내는 문자 받겠다고 하신 분께만 보낼 수 있어서 ${A.matched.length - A.send.length}분은 빠져요. 이분들께는 전화로 안부를 여쭤 보세요.</p>` : ''}
      ${C.type === 'info' && A.noOrder ? `<p class="note small">주문, 배송 안내는 올해 주문하신 분께만 보낼 수 있어서 ${A.noOrder}분은 빠져요.</p>` : ''}
      ${A.send.length ? `<div class="names">${A.send.slice(0, 14).map(c => `<span>${esc(c.name)}</span>`).join('')}${A.send.length > 14 ? `<span>외 ${A.send.length - 14}분</span>` : ''}</div>` : ''}`;
  }
  $('#s-typehelp').textContent = C.type === 'ad' ? '동의하신 분께만 가요. 맨 앞에 (광고), 맨 끝에 수신거부 번호가 자동으로 붙어요.' : '광고가 아닌 주문 관련 연락이라 동의 없이 보낼 수 있어요. {이름}, {보낼날}은 손님마다 바뀌어 들어가요.';
  const sample = A && A.send.length ? A.send[0] : null;
  $('#s-preview').innerHTML = finalText(sample);
  const plain = C.type === 'ad' ? '(광고)' + C.text + '\n무료수신거부 080-000-0000' : C.text;
  const by = bytesOf(plain);
  $('#s-bytes').innerHTML = `<span>${by > 2000 ? '<b style="color:var(--bad)">너무 길어요 (2,000바이트까지)</b>' : by > 90 ? '장문 문자 (LMS)' : '단문 문자 (SMS)'}</span><span class="num">${by.toLocaleString()} / ${by > 90 ? '2,000' : '90'}바이트</span>`;
  const night = C.type === 'ad' && C.mode === 'now' && isNight();
  const nb = $('#s-night'); nb.hidden = !night; if (night) nb.textContent = '밤 9시부터 아침 8시까지는 판매 안내를 보낼 수 없어요. 내일 오전 10시에 보내기를 고르세요.';
  const can = A && A.send.length && by <= 2000 && C.text.trim() && !night;
  $('#s-go').innerHTML = C.confirm && can
    ? `<div class="confirm"><b style="font-size:20px">${A.send.length}분께 ${C.type === 'ad' ? '판매 안내' : '주문 안내'}를 ${C.mode === 'now' ? '지금' : '내일 오전 10시에'} 보낼까요?</b><p class="muted small">보낸 뒤에는 취소할 수 없어요.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary big" data-act="send-ok">네, 보내기</button><button class="btn big" data-act="send-cancel">다시 볼게요</button></div></div>`
    : `<button class="btn primary big wide" data-act="send" ${can ? '' : 'disabled'}>${A && A.send.length ? `${A.send.length}분께 보내기` : '보낼 분을 먼저 골라 주세요'}</button>`;
  $('#s-hist').innerHTML = C.history.length ? C.history.map(h => `<li><b>${esc(h.label)}</b><span class="muted small">${h.when}, ${h.count}분, ${h.type === 'ad' ? '판매 안내' : '주문 안내'}</span></li>`).join('') : '<li class="muted">아직 보낸 안내가 없어요. 보낸 뒤 며칠 안에 들어온 주문도 여기서 보여 드릴 예정이에요.</li>';
}
const vSend = $('#v-send');
vSend.addEventListener('click', e => {
  const pr = e.target.closest('[data-preset]');
  if (pr){ const p = PRESETS.find(x => x.id === pr.dataset.preset); C.preset = p.id; C.conds = p.conds(); setType(p.type); C.confirm = false; $('#s-nlmsg').hidden = true; sendDyn(); return; }
  const rm = e.target.closest('[data-rm]'); if (rm){ C.conds = C.conds.filter(k => k.key !== rm.dataset.rm); C.preset = null; C.confirm = false; sendDyn(); return; }
  const md_ = e.target.closest('[data-mode]'); if (md_){ C.mode = md_.dataset.mode; document.querySelectorAll('#v-send [data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === C.mode)); C.confirm = false; sendDyn(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.dataset.act === 'nl') runNL();
  else if (b.dataset.act === 'send'){ C.confirm = true; sendDyn(); }
  else if (b.dataset.act === 'send-cancel'){ C.confirm = false; sendDyn(); }
  else if (b.dataset.act === 'send-ok'){
    const A = audience();
    const label = C.preset ? PRESETS.find(p => p.id === C.preset).label : C.conds.map(k => k.label).join(', ');
    C.history.unshift({ label, count:A.send.length, type:C.type, when: C.mode === 'now' ? `${md(TODAY_ISO)} 보냄` : `${md('2026-10-04')} 오전 10시 예약` });
    C.confirm = false; sendDyn();
    toast(`시연 화면이라 실제로 보내지는 않았어요. 실제 서비스에서는 ${A.send.length}분께 ${C.mode === 'now' ? '바로' : '예약한 시간에'} 나가요`);
  }
});
function setType(t){ C.type = t; if (!C.edited) C.text = TPL[t]; const ta = $('#s-text'); if (ta) ta.value = C.text; document.querySelectorAll('#v-send input[name="mtype"]').forEach(r => r.checked = r.value === t); }
function runNL(){
  const v = $('#s-nl').value.trim(); C.nl = v; const m = $('#s-nlmsg');
  if (!v){ m.hidden = false; m.textContent = '어떤 손님에게 보낼지 적어 주세요.'; return; }
  const conds = parseNL(v);
  if (!conds.length){ m.hidden = false; m.textContent = "알아듣지 못했어요. '작년에 사셨는데 올해 아직 안 오신 분'처럼 언제, 무엇을, 몇 박스, 어느 지역인지 넣어 적어 보세요."; return; }
  m.hidden = true; C.conds = conds; C.preset = null; C.confirm = false; sendDyn();
}
vSend.addEventListener('keydown', e => { if (e.target.id === 's-nl' && e.key === 'Enter'){ e.preventDefault(); runNL(); } });
vSend.addEventListener('input', e => { if (e.target.id === 's-text'){ C.text = e.target.value; C.edited = true; C.confirm = false; sendDyn(); } else if (e.target.id === 's-nl') C.nl = e.target.value; });
vSend.addEventListener('change', e => { if (e.target.name === 'mtype'){ setType(e.target.value); C.confirm = false; sendDyn(); } });

/* ================= 시작 ================= */
const start = (location.hash || '').replace('#', '');
go(VIEWS.includes(start) ? start : 'home');
})();
</script>

</body>
</html>
